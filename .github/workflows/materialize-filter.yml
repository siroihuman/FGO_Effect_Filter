name: Materialize FGO effect filter

on:
  push:
    paths:
      - "tools/Ra_FGOEffectFilter.js.gz.b64"
      - ".github/workflows/materialize-filter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore JavaScript source
        shell: bash
        run: |
          base64 --decode tools/Ra_FGOEffectFilter.js.gz.b64 | gzip --decompress > Ra_FGOEffectFilter.js
          node --check Ra_FGOEffectFilter.js

      - name: Commit restored source
        shell: bash
        run: |
          if git diff --quiet -- Ra_FGOEffectFilter.js; then
            echo "Ra_FGOEffectFilter.js is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ra_FGOEffectFilter.js
          git commit -m "Add FGO effect filter source"
          git push
